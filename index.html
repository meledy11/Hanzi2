<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Каллиграфия</title>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #1a1512;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 0.4rem;
            touch-action: none;
        }
        html {
            height: -webkit-fill-available;
        }

        .app {
            background: #f5efe6;
            background-image: radial-gradient(circle at 30% 20%, #fcf8f2 0%, #ece3d5 100%);
            padding: 0.6rem 0.6rem 0.8rem;
            border-radius: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 0 3px #c4b5a0 inset;
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: relative;
        }

        /* Верхняя строка — миниатюры предложения */
        .phrase-thumbnails {
            display: flex;
            gap: 0.2rem;
            flex-wrap: wrap;
            justify-content: center;
            background: rgba(255, 248, 240, 0.5);
            padding: 0.25rem 0.4rem;
            border-radius: 1.2rem;
            border: 1px solid #d6c8b4;
            min-height: 2rem;
            align-items: center;
        }
        .phrase-thumb {
            font-size: 1.1rem;
            font-family: 'Georgia', serif;
            color: #6a5f55;
            padding: 0.05rem 0.25rem;
            border-radius: 0.3rem;
            cursor: pointer;
            transition: all 0.15s;
            opacity: 0.4;
            line-height: 1.3;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .phrase-thumb.active {
            opacity: 1;
            color: #3d3228;
            background: rgba(212, 168, 64, 0.2);
            transform: scale(1.08);
        }
        .phrase-thumb.playing {
            animation: thumbPulse 0.5s ease 3;
        }
        @keyframes thumbPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
                color: #d4a840;
            }
        }
        .phrase-thumb .thumb-num {
            font-size: 0.4rem;
            color: #b8a898;
            line-height: 1;
            margin-top: -1px;
        }
        .phrase-thumb .thumb-char {
            line-height: 1.2;
        }

        .input-row {
            display: flex;
            gap: 0.4rem;
            background: rgba(255, 248, 240, 0.6);
            padding: 0.3rem 0.5rem;
            border-radius: 1.5rem;
            border: 2px solid #d6c8b4;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.04);
        }
        .input-row input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 1rem;
            font-family: 'Georgia', serif;
            color: #3d3228;
            padding: 0.2rem 0.4rem;
            min-width: 0;
            letter-spacing: 1px;
        }
        .input-row input::placeholder {
            color: #b8a898;
            font-style: italic;
            font-size: 0.85rem;
        }
        .input-row button {
            background: #d6c8b4;
            border: none;
            border-radius: 1.2rem;
            padding: 0.25rem 0.9rem;
            font-size: 0.9rem;
            font-weight: 700;
            color: #3d3228;
            cursor: pointer;
            box-shadow: 0 3px 0 #b8a898;
            transition: all 0.08s ease;
            font-family: 'Georgia', serif;
            white-space: nowrap;
        }
        .input-row button:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        .writer-wrapper {
            background: #fcf8f0;
            border-radius: 1.5rem;
            box-shadow: 0 6px 0 #c4b5a0, 0 12px 30px rgba(0, 0, 0, 0.12);
            padding: 0.4rem;
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            overflow: hidden;
            transition: transform 0.1s;
        }
        .writer-wrapper.shake {
            animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both;
        }
        @keyframes shake {
            10%,
            90% {
                transform: translate3d(-2px, 0, 0);
            }
            20%,
            80% {
                transform: translate3d(4px, 0, 0);
            }
            30%,
            50%,
            70% {
                transform: translate3d(-6px, 0, 0);
            }
            40%,
            60% {
                transform: translate3d(6px, 0, 0);
            }
        }
        #hw-container {
            width: 100%;
            height: 100%;
            border-radius: 1rem;
            position: relative;
        }
        #hw-container svg {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        .draw-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
            border-radius: 1rem;
        }
        .draw-overlay.active {
            pointer-events: auto;
            cursor: crosshair;
        }
        .draw-overlay canvas {
            width: 100%;
            height: 100%;
            border-radius: 1rem;
            display: block;
        }

        .char-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.05rem 0.3rem;
            gap: 0.3rem;
            flex-wrap: wrap;
        }
        .char-info .label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a3f35;
            opacity: 0.7;
            font-style: italic;
        }
        .char-info .status {
            font-size: 0.65rem;
            padding: 0.1rem 0.5rem;
            border-radius: 1rem;
            background: #d6c8b4;
            color: #3d3228;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 0.35rem;
            flex-wrap: wrap;
        }
        .controls .btn {
            flex: 1;
            min-width: 42px;
            background: #d6c8b4;
            border: none;
            border-radius: 0.9rem;
            padding: 0.4rem 0.15rem;
            font-size: 0.7rem;
            font-weight: 700;
            color: #3d3228;
            box-shadow: 0 3px 0 #b8a898;
            cursor: pointer;
            transition: all 0.08s ease;
            font-family: 'Georgia', serif;
            text-align: center;
        }
        .controls .btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }
        .controls .btn-primary {
            background: #d4b89a;
            box-shadow: 0 3px 0 #b09072;
        }
        .controls .btn-hint {
            background: #b8c4a8;
            box-shadow: 0 3px 0 #8fa080;
        }
        .controls .btn-speak {
            background: #c4b8d8;
            box-shadow: 0 3px 0 #a090b8;
        }
        .controls .btn-draw {
            background: #f0d58c;
            box-shadow: 0 3px 0 #c9b06a;
        }
        .controls .btn-draw.active {
            background: #d4a840;
            color: white;
            box-shadow: 0 3px 0 #a08030;
        }
        .controls .btn-play-all {
            background: #8fb88a;
            color: #1f2a1c;
            box-shadow: 0 3px 0 #5f7a5a;
        }

        .settings {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
            background: rgba(255, 248, 240, 0.4);
            padding: 0.25rem 0.5rem;
            border-radius: 1.2rem;
            border: 1px solid #d6c8b4;
        }
        .settings label {
            font-size: 0.65rem;
            color: #6a5f55;
            display: flex;
            align-items: center;
            gap: 0.2rem;
            font-weight: 600;
        }
        .settings input[type="range"] {
            width: 55px;
            accent-color: #b8a898;
            background: #d6c8b4;
            border-radius: 10px;
            height: 3px;
        }
        .settings span {
            font-size: 0.65rem;
            color: #3d3228;
            min-width: 18px;
            font-weight: 700;
        }

        .progress {
            width: 100%;
            height: 4px;
            background: #ddd0c0;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #8a7a6a;
            width: 0%;
            transition: width 0.3s ease;
        }

        .floating-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            font-weight: 800;
            color: #d4a840;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.15);
            pointer-events: none;
            opacity: 0;
            z-index: 100;
            white-space: nowrap;
            font-family: 'Georgia', serif;
        }
        .floating-text.show {
            animation: floatUp 1s ease-out forwards;
        }
        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            20% {
                opacity: 1;
                transform: translate(-50%, -60%) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -100%) scale(1);
            }
        }

        .hint-text {
            text-align: center;
            font-size: 0.75rem;
            color: #7a6f65;
            font-style: italic;
            min-height: 1em;
            font-family: 'Georgia', serif;
        }

        .mode-toggle {
            display: flex;
            gap: 0.2rem;
            align-items: center;
        }
        .mode-toggle .btn {
            flex: 0 1 auto;
            padding: 0.2rem 0.5rem;
            font-size: 0.6rem;
            min-width: 28px;
        }
        .mode-toggle .btn.active-mode {
            background: #d4a840;
            color: white;
            box-shadow: 0 3px 0 #a08030;
        }

        @media (max-width: 400px) {
            .app {
                padding: 0.4rem;
            }
            .input-row input {
                font-size: 0.85rem;
            }
            .input-row button {
                padding: 0.2rem 0.6rem;
                font-size: 0.75rem;
            }
            .controls .btn {
                font-size: 0.6rem;
                padding: 0.35rem 0.1rem;
                min-width: 35px;
            }
            .settings input[type="range"] {
                width: 40px;
            }
            .phrase-thumb {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- Миниатюры предложения -->
        <div class="phrase-thumbnails" id="phraseThumbnails"></div>

        <!-- Ввод -->
        <div class="input-row">
            <input type="text" id="charInput" placeholder="Введите предложение..." value="我是中国人" maxlength="30">
            <button id="renderBtn">✍️</button>
        </div>

        <!-- Холст -->
        <div class="writer-wrapper" id="writerWrapper">
            <div id="hw-container"></div>
            <div class="draw-overlay" id="drawOverlay">
                <canvas id="drawCanvas"></canvas>
            </div>
            <div class="floating-text" id="floatingText"></div>
        </div>

        <!-- Информация -->
        <div class="char-info">
            <span class="label" id="charLabel">⏳ загрузка...</span>
            <span class="status" id="charStatus">✍️</span>
        </div>

        <!-- Прогресс -->
        <div class="progress">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <!-- Подсказка -->
        <div class="hint-text" id="hintText">✍️ Обводите по порядку черт</div>

        <!-- Настройки -->
        <div class="settings">
            <label>⏱️ <input type="range" id="speedRange" min="300" max="1500" value="700"><span id="speedVal">700</span></label>
            <label>✏️ <input type="range" id="widthRange" min="3" max="20" value="8"><span id="widthVal">8</span></label>
            <div class="mode-toggle">
                <button class="btn active-mode" id="modeOrder">📐 порядок</button>
                <button class="btn" id="modeFree">🖌️ маркер</button>
            </div>
        </div>

        <!-- Кнопки -->
        <div class="controls">
            <button class="btn btn-hint" id="hintBtn">👁️ подсказка</button>
            <button class="btn btn-speak" id="speakBtn">🔊 озвучка</button>
            <button class="btn btn-primary" id="playBtn">▶️ анимация</button>
            <button class="btn btn-play-all" id="playAllBtn">🎬 все</button>
            <button class="btn" id="resetBtn">⟲ сброс</button>
            <button class="btn btn-primary" id="nextBtn">⏭️ дальше</button>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. ОСНОВНАЯ ЛОГИКА
        // ============================================================
        let charList = [];
        let currentIndex = 0;
        let hwWriter = null;
        let isShowingHint = false;
        let isAnimating = false;
        let completedStrokes = 0;
        let totalStrokes = 0;
        let isFreeDrawMode = false;
        let isDrawing = false;
        let lastX = 0,
            lastY = 0;
        let isPlayingAll = false;
        let playAllTimers = [];

        const hwContainer = document.getElementById('hw-container');
        const drawOverlay = document.getElementById('drawOverlay');
        const drawCanvas = document.getElementById('drawCanvas');
        const charInput = document.getElementById('charInput');
        const renderBtn = document.getElementById('renderBtn');
        const charLabel = document.getElementById('charLabel');
        const charStatus = document.getElementById('charStatus');
        const hintText = document.getElementById('hintText');
        const progressFill = document.getElementById('progressFill');
        const floatingText = document.getElementById('floatingText');
        const phraseThumbnails = document.getElementById('phraseThumbnails');
        const speedRange = document.getElementById('speedRange');
        const speedVal = document.getElementById('speedVal');
        const widthRange = document.getElementById('widthRange');
        const widthVal = document.getElementById('widthVal');
        const hintBtn = document.getElementById('hintBtn');
        const speakBtn = document.getElementById('speakBtn');
        const playBtn = document.getElementById('playBtn');
        const playAllBtn = document.getElementById('playAllBtn');
        const resetBtn = document.getElementById('resetBtn');
        const nextBtn = document.getElementById('nextBtn');
        const writerWrapper = document.getElementById('writerWrapper');
        const modeOrder = document.getElementById('modeOrder');
        const modeFree = document.getElementById('modeFree');

        // ============================================================
        // 2. РИСОВАНИЕ (свободный маркер)
        // ============================================================
        function initDrawCanvas() {
            const rect = drawOverlay.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            drawCanvas.width = rect.width * dpr;
            drawCanvas.height = rect.height * dpr;
            drawCanvas.style.width = rect.width + 'px';
            drawCanvas.style.height = rect.height + 'px';
            const ctx = drawCanvas.getContext('2d');
            ctx.scale(dpr, dpr);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            return ctx;
        }

        let drawCtx = null;

        function getDrawPos(e) {
            const rect = drawCanvas.getBoundingClientRect();
            const touch = e.touches ? e.touches[0] : e;
            return {
                x: (touch.clientX - rect.left),
                y: (touch.clientY - rect.top)
            };
        }

        function startDraw(e) {
            if (!isFreeDrawMode) return;
            e.preventDefault();
            isDrawing = true;
            const pos = getDrawPos(e);
            lastX = pos.x;
            lastY = pos.y;
            if (!drawCtx) drawCtx = initDrawCanvas();
            drawCtx.beginPath();
            drawCtx.moveTo(lastX, lastY);
        }

        function moveDraw(e) {
            if (!isDrawing || !isFreeDrawMode) return;
            e.preventDefault();
            const pos = getDrawPos(e);
            if (!drawCtx) drawCtx = initDrawCanvas();
            const lineWidth = parseInt(widthRange.value) || 8;
            drawCtx.lineWidth = lineWidth;
            drawCtx.strokeStyle = '#2c241e';
            drawCtx.lineTo(pos.x, pos.y);
            drawCtx.stroke();
            drawCtx.beginPath();
            drawCtx.moveTo(pos.x, pos.y);
            lastX = pos.x;
            lastY = pos.y;
        }

        function endDraw(e) {
            if (isDrawing) {
                isDrawing = false;
                if (drawCtx) {
                    drawCtx.closePath();
                }
            }
        }

        drawCanvas.addEventListener('touchstart', startDraw, { passive: false });
        drawCanvas.addEventListener('touchmove', moveDraw, { passive: false });
        drawCanvas.addEventListener('touchend', endDraw, { passive: false });
        drawCanvas.addEventListener('touchcancel', endDraw, { passive: false });
        drawCanvas.addEventListener('mousedown', startDraw);
        drawCanvas.addEventListener('mousemove', moveDraw);
        drawCanvas.addEventListener('mouseup', endDraw);
        drawCanvas.addEventListener('mouseleave', endDraw);

        // ============================================================
        // 3. ПЕРЕКЛЮЧЕНИЕ РЕЖИМОВ
        // ============================================================
        function setMode(mode) {
            isFreeDrawMode = (mode === 'free');
            drawOverlay.classList.toggle('active', isFreeDrawMode);
            modeOrder.classList.toggle('active-mode', !isFreeDrawMode);
            modeFree.classList.toggle('active-mode', isFreeDrawMode);
            if (isFreeDrawMode) {
                hintText.textContent = '🖌️ Рисуйте свободно маркером поверх иероглифа';
                hintText.style.color = '#8a4a2a';
                drawCtx = initDrawCanvas();
            } else {
                hintText.textContent = '✍️ Обводите по порядку черт';
                hintText.style.color = '#7a6f65';
            }
        }

        modeOrder.addEventListener('click', () => setMode('order'));
        modeFree.addEventListener('click', () => setMode('free'));

        // ============================================================
        // 4. ОЧИСТКА РИСУНКА
        // ============================================================
        function clearDraw() {
            if (drawCtx) {
                const rect = drawCanvas.getBoundingClientRect();
                drawCtx.clearRect(0, 0, rect.width, rect.height);
            }
        }

        // ============================================================
        // 5. ЗАГРУЗКА ИЕРОГЛИФА
        // ============================================================
        function getWriterSize() {
            const rect = hwContainer.getBoundingClientRect();
            return Math.max(150, Math.floor(Math.min(rect.width, rect.height)));
        }

        function updateProgress(percent) {
            progressFill.style.width = `${Math.min(percent, 100)}%`;
        }

        function showFloatingText(text) {
            floatingText.textContent = text;
            floatingText.classList.remove('show');
            void floatingText.offsetWidth;
            floatingText.classList.add('show');
        }

        function playSound(type) {
            try {
                const ctx = new(window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
                const now = ctx.currentTime;
                if (type === 'success') {
                    const osc = ctx.createOscillator(),
                        gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.exponentialRampToValueAtTime(1046.5, now + 0.1);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'error') {
                    const osc = ctx.createOscillator(),
                        gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(100, now + 0.15);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'complete') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        const o = ctx.createOscillator(),
                            g = ctx.createGain();
                        o.connect(g);
                        g.connect(ctx.destination);
                        o.type = 'sine';
                        o.frequency.value = freq;
                        g.gain.setValueAtTime(0.2, now + i * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.5);
                        o.start(now + i * 0.1);
                        o.stop(now + i * 0.1 + 0.5);
                    });
                }
            } catch (e) { /* тихо */ }
        }

        function speakChar(char) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utt = new SpeechSynthesisUtterance(char);
            utt.lang = 'zh-CN';
            utt.rate = 0.7;
            window.speechSynthesis.speak(utt);
        }

        function speakCharSync(char) {
            return new Promise((resolve) => {
                if (!('speechSynthesis' in window)) { resolve(); return; }
                const utt = new SpeechSynthesisUtterance(char);
                utt.lang = 'zh-CN';
                utt.rate = 0.7;
                utt.onend = () => resolve();
                utt.onerror = () => resolve();
                window.speechSynthesis.speak(utt);
            });
        }

        function updateThumbnails(playingIndex) {
            phraseThumbnails.innerHTML = '';
            charList.forEach((ch, idx) => {
                const el = document.createElement('div');
                el.className = 'phrase-thumb' + (idx === currentIndex ? ' active' : '') +
                    (idx === playingIndex ? ' playing' : '');
                el.innerHTML =
                    `<span class="thumb-num">${idx+1}</span><span class="thumb-char">${ch}</span>`;
                el.addEventListener('click', () => {
                    if (isPlayingAll) return;
                    currentIndex = idx;
                    loadCharacter(charList[idx]);
                    updateThumbnails();
                });
                phraseThumbnails.appendChild(el);
            });
        }

        function loadCharacter(char) {
            if (!char || char.trim() === '') {
                char = '永';
                charInput.value = '永';
            }

            clearDraw();
            charLabel.textContent = `${char} · загрузка...`;
            charStatus.textContent = '⏳';
            hintText.textContent = '⏳ Загрузка данных...';
            hwContainer.innerHTML = '';
            isShowingHint = false;
            isAnimating = false;
            completedStrokes = 0;
            updateProgress(0);

            const size = getWriterSize();
            const lineWidth = parseInt(widthRange.value) || 8;
            const delay = parseInt(speedRange.value) || 700;

            try {
                hwWriter = HanziWriter.create('hw-container', char, {
                    width: size,
                    height: size,
                    padding: 15,
                    showOutline: true,
                    strokeAnimationSpeed: 1.2,
                    delayBetweenStrokes: delay,
                    drawingWidth: Math.max(3, Math.min(14, lineWidth)),
                    showCharacter: false,
                    highlightColor: '#c0392b',
                    outlineColor: '#d6c8b4',
                    drawingColor: '#2c241e',
                    showHintAfterMisses: 1,
                    highlightOnComplete: true
                });

                hwWriter.getCharacterData()
                    .then(function(charData) {
                        totalStrokes = charData.strokes.length;
                        charStatus.textContent = `✍️ ${totalStrokes} штрихов`;
                        charLabel.textContent = `${char} · ${totalStrokes} штр.`;
                        hintText.textContent = isFreeDrawMode ? '🖌️ Рисуйте свободно' :
                            '✍️ Обводите по порядку черт';
                        hintText.style.color = isFreeDrawMode ? '#8a4a2a' : '#7a6f65';
                        updateProgress(0);
                        updateThumbnails();
                    })
                    .catch(function(err) {
                        console.warn('Ошибка загрузки данных:', err);
                        charStatus.textContent = '❌ нет данных';
                        charStatus.className = 'status error';
                        charLabel.textContent = `${char} · нет данных`;
                        hintText.textContent = '❌ Hanzi Writer не поддерживает этот иероглиф';
                        hintText.style.color = '#8a4a2a';
                        const fallback = document.createElement('div');
                        fallback.style.cssText =
                            `width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:5rem; color:#8a7a6a; font-family: 'Georgia', serif; background: rgba(0,0,0,0.02); border-radius:1rem;`;
                        fallback.textContent = char;
                        hwContainer.appendChild(fallback);
                        updateThumbnails();
                    });

                if (!isFreeDrawMode) {
                    hwWriter.quiz({
                        onCorrectStroke: function(strokeData) {
                            if (isShowingHint || isAnimating) return;
                            completedStrokes = strokeData.strokeNum;
                            const percent = totalStrokes > 0 ? (completedStrokes / totalStrokes) * 100 :
                            0;
                            updateProgress(percent);
                            playSound('success');
                            if (completedStrokes === totalStrokes) {
                                showFloatingText('🎉 Отлично!');
                                playSound('complete');
                                hintText.textContent = '✅ Готово! Нажмите "дальше" для следующего';
                                hintText.style.color = '#4a6a4a';
                            }
                        },
                        onMistake: function() {
                            if (isShowingHint || isAnimating) return;
                            playSound('error');
                            writerWrapper.classList.add('shake');
                            setTimeout(() => writerWrapper.classList.remove('shake'), 400);
                            hintText.textContent = '⚠️ Ошибка! Смотрите на красную подсказку';
                            hintText.style.color = '#8a4a2a';
                        },
                        onComplete: function() {}
                    });
                }

            } catch (e) {
                console.error('Ошибка создания Hanzi Writer:', e);
                charStatus.textContent = '❌ ошибка';
                charStatus.className = 'status error';
                charLabel.textContent = `${char} · ошибка`;
                hintText.textContent = '❌ Ошибка загрузки иероглифа';
                hintText.style.color = '#8a4a2a';
                const fallback = document.createElement('div');
                fallback.style.cssText =
                    `width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:5rem; color:#8a7a6a; font-family: 'Georgia', serif; background: rgba(0,0,0,0.02); border-radius:1rem;`;
                fallback.textContent = char;
                hwContainer.appendChild(fallback);
            }
        }

        // ============================================================
        // 6. АНИМАЦИЯ ВСЕГО ПРЕДЛОЖЕНИЯ
        // ============================================================
        async function playAllCharacters() {
            if (isPlayingAll) return;
            if (charList.length === 0) {
                const text = charInput.value.trim() || '永';
                charList = text.split('');
                currentIndex = 0;
            }

            isPlayingAll = true;
            playAllBtn.textContent = '⏹️ стоп';
            playAllBtn.style.background = '#e8b4b4';

            for (let i = 0; i < charList.length; i++) {
                if (!isPlayingAll) break;
                currentIndex = i;
                const ch = charList[i];

                // Загружаем иероглиф
                await new Promise((resolve) => {
                    // Временный обработчик для загрузки
                    const origLoad = loadCharacter;
                    loadCharacter = function(char) {
                        origLoad.call(this, char);
                        // Ждём, пока загрузится
                        const checkLoaded = setInterval(() => {
                            if (charStatus.textContent.includes('штрихов') || charStatus.textContent
                                .includes('нет данных')) {
                                clearInterval(checkLoaded);
                                // Обновляем миниатюры с подсветкой
                                updateThumbnails(i);
                                // Озвучиваем
                                speakChar(ch);
                                showFloatingText(`📖 ${ch}`);
                                resolve();
                            }
                        }, 100);
                        // Таймаут на всякий случай
                        setTimeout(() => {
                            clearInterval(checkLoaded);
                            resolve();
                        }, 3000);
                    };
                    loadCharacter(ch);
                });

                // Ждём завершения анимации или просто паузу
                await new Promise((resolve) => {
                    const delay = parseInt(speedRange.value) * 2 + 500;
                    setTimeout(resolve, delay);
                });

                // Проверяем, не остановили ли
                if (!isPlayingAll) break;
            }

            // Восстанавливаем
            isPlayingAll = false;
            playAllBtn.textContent = '🎬 все';
            playAllBtn.style.background = '';
            showFloatingText('🎉 Все иероглифы показаны!');
            updateThumbnails();
        }

        function stopPlayAll() {
            isPlayingAll = false;
            playAllBtn.textContent = '🎬 все';
            playAllBtn.style.background = '';
            window.speechSynthesis.cancel();
            if (hwWriter) hwWriter.cancelAnimation();
            updateThumbnails();
        }

        // ============================================================
        // 7. ДЕЙСТВИЯ
        // ============================================================
        function showHint() {
            if (!hwWriter || isShowingHint || isAnimating || isFreeDrawMode) return;
            isShowingHint = true;
            hintText.textContent = '👀 Смотрите анимацию...';
            hintText.style.color = '#8a4a2a';
            hwWriter.animateCharacter({
                onComplete: function() {
                    setTimeout(() => {
                        isShowingHint = false;
                        loadCharacter(currentChar);
                        showFloatingText('🔄 Начинаем заново');
                        hintText.textContent = '✍️ Обводите по порядку черт';
                        hintText.style.color = '#7a6f65';
                    }, 500);
                }
            });
        }

        function playAnimation() {
            if (!hwWriter || isAnimating || isShowingHint || isFreeDrawMode) return;
            isAnimating = true;
            hintText.textContent = '🎬 Анимация...';
            hintText.style.color = '#8a4a2a';
            speakChar(currentChar);
            hwWriter.animateCharacter({
                onComplete: function() {
                    setTimeout(() => {
                        isAnimating = false;
                        showFloatingText('🔄 Теперь обводите сами');
                        hintText.textContent = '✍️ Обводите по порядку черт';
                        hintText.style.color = '#7a6f65';
                    }, 500);
                }
            });
        }

        function resetCharacter() {
            if (hwWriter) hwWriter.cancelAnimation();
            isShowingHint = false;
            isAnimating = false;
            clearDraw();
            loadCharacter(currentChar);
            showFloatingText('⟲ Сброс');
        }

        function nextCharacter() {
            if (isPlayingAll) return;
            if (charList.length === 0) {
                const text = charInput.value.trim() || '永';
                charList = text.split('');
                currentIndex = 0;
            }
            if (charList.length === 0) {
                charInput.value = '永';
                charList = ['永'];
                currentIndex = 0;
            }
            if (currentIndex < charList.length - 1) {
                currentIndex++;
            } else {
                currentIndex = 0;
            }
            const next = charList[currentIndex];
            if (next) {
                clearDraw();
                loadCharacter(next);
                showFloatingText(`📖 ${next}`);
                updateThumbnails();
            }
        }

        // ============================================================
        // 8. ОБРАБОТЧИКИ
        // ============================================================
        renderBtn.addEventListener('click', function() {
            if (isPlayingAll) stopPlayAll();
            const text = charInput.value.trim() || '永';
            charList = text.split('');
            currentIndex = 0;
            clearDraw();
            if (charList.length > 0) {
                loadCharacter(charList[0]);
                showFloatingText(`📖 ${charList[0]}`);
            }
        });

        charInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') renderBtn.click();
        });

        speedRange.addEventListener('input', function() {
            speedVal.textContent = this.value;
        });

        widthRange.addEventListener('input', function() {
            widthVal.textContent = this.value;
            if (hwWriter && !isFreeDrawMode) loadCharacter(currentChar);
        });

        hintBtn.addEventListener('click', function() {
            if (hwWriter && !isFreeDrawMode) showHint();
        });

        speakBtn.addEventListener('click', function() {
            speakChar(currentChar);
            showFloatingText(`🔊 ${currentChar}`);
        });

        playBtn.addEventListener('click', function() {
            if (hwWriter && !isFreeDrawMode) playAnimation();
        });

        playAllBtn.addEventListener('click', function() {
            if (isPlayingAll) {
                stopPlayAll();
            } else {
                playAllCharacters();
            }
        });

        resetBtn.addEventListener('click', function() {
            if (isPlayingAll) stopPlayAll();
            resetCharacter();
        });

        nextBtn.addEventListener('click', function() {
            if (isPlayingAll) return;
            nextCharacter();
        });

        // ============================================================
        // 9. ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        const initialText = charInput.value.trim() || '永';
        charList = initialText.split('');
        currentIndex = 0;
        loadCharacter(charList[0] || '永');
        updateThumbnails();

        setTimeout(() => {
            drawCtx = initDrawCanvas();
            drawOverlay.classList.toggle('active', isFreeDrawMode);
        }, 100);

        let resizeTimeout;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (hwWriter && !isShowingHint && !isAnimating && !isPlayingAll) {
                    loadCharacter(currentChar);
                }
                drawCtx = initDrawCanvas();
            }, 300);
        });

        console.log('✅ Каллиграфия загружена!');
        console.log('📚 Два режима: порядок черт + свободный маркер');
        console.log('🎬 Кнопка "все" — анимация всего предложения с озвучкой');
        console.log('📖 Вверху показано всё предложение с нумерацией');
    </script>
</body>
</html>
