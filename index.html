<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Каллиграфия</title>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #1a1512;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 0.4rem;
            touch-action: none;
        }
        html {
            height: -webkit-fill-available;
        }

        .app {
            background: #f5efe6;
            background-image: radial-gradient(circle at 30% 20%, #fcf8f2 0%, #ece3d5 100%);
            padding: 0.6rem 0.6rem 0.8rem;
            border-radius: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 0 3px #c4b5a0 inset;
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: relative;
        }

        .thumbnails {
            display: flex;
            gap: 0.2rem;
            flex-wrap: wrap;
            justify-content: center;
            background: rgba(255, 248, 240, 0.5);
            padding: 0.25rem 0.4rem;
            border-radius: 1.2rem;
            border: 1px solid #d6c8b4;
            min-height: 2rem;
            align-items: center;
        }
        .thumb {
            font-size: 1.1rem;
            font-family: 'Georgia', serif;
            color: #6a5f55;
            padding: 0.05rem 0.25rem;
            border-radius: 0.3rem;
            cursor: pointer;
            transition: all 0.15s;
            opacity: 0.4;
            line-height: 1.3;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .thumb.active {
            opacity: 1;
            color: #3d3228;
            background: rgba(212, 168, 64, 0.2);
            transform: scale(1.08);
        }
        .thumb.playing {
            animation: pulse 0.5s ease 3;
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
                color: #d4a840;
            }
        }
        .thumb .num {
            font-size: 0.4rem;
            color: #b8a898;
            line-height: 1;
            margin-top: -1px;
        }
        .thumb .char {
            line-height: 1.2;
        }

        .input-row {
            display: flex;
            gap: 0.4rem;
            background: rgba(255, 248, 240, 0.6);
            padding: 0.3rem 0.5rem;
            border-radius: 1.5rem;
            border: 2px solid #d6c8b4;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.04);
        }
        .input-row input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 1rem;
            font-family: 'Georgia', serif;
            color: #3d3228;
            padding: 0.2rem 0.4rem;
            min-width: 0;
            letter-spacing: 1px;
        }
        .input-row input::placeholder {
            color: #b8a898;
            font-style: italic;
            font-size: 0.85rem;
        }
        .input-row button {
            background: #d6c8b4;
            border: none;
            border-radius: 1.2rem;
            padding: 0.25rem 0.9rem;
            font-size: 0.9rem;
            font-weight: 700;
            color: #3d3228;
            cursor: pointer;
            box-shadow: 0 3px 0 #b8a898;
            transition: all 0.08s ease;
            font-family: 'Georgia', serif;
            white-space: nowrap;
        }
        .input-row button:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        .writer-wrap {
            background: #fcf8f0;
            border-radius: 1.5rem;
            box-shadow: 0 6px 0 #c4b5a0, 0 12px 30px rgba(0, 0, 0, 0.12);
            padding: 0.4rem;
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            overflow: hidden;
            transition: transform 0.1s;
        }
        .writer-wrap.shake {
            animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both;
        }
        @keyframes shake {
            10%,
            90% {
                transform: translate3d(-2px, 0, 0);
            }
            20%,
            80% {
                transform: translate3d(4px, 0, 0);
            }
            30%,
            50%,
            70% {
                transform: translate3d(-6px, 0, 0);
            }
            40%,
            60% {
                transform: translate3d(6px, 0, 0);
            }
        }
        #hw {
            width: 100%;
            height: 100%;
            border-radius: 1rem;
            position: relative;
        }
        #hw svg {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        .draw-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: auto;
            border-radius: 1rem;
            cursor: crosshair;
        }
        .draw-overlay canvas {
            width: 100%;
            height: 100%;
            border-radius: 1rem;
            display: block;
            touch-action: none;
        }

        .info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.05rem 0.3rem;
            gap: 0.3rem;
            flex-wrap: wrap;
        }
        .info .label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a3f35;
            opacity: 0.7;
            font-style: italic;
        }
        .info .status {
            font-size: 0.65rem;
            padding: 0.1rem 0.5rem;
            border-radius: 1rem;
            background: #d6c8b4;
            color: #3d3228;
            font-weight: 600;
        }
        .info .status.error {
            background: #e8b4b4;
            color: #5a1a1a;
        }

        .progress {
            width: 100%;
            height: 4px;
            background: #ddd0c0;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #8a7a6a;
            width: 0%;
            transition: width 0.3s ease;
        }

        .hint {
            text-align: center;
            font-size: 0.75rem;
            color: #7a6f65;
            font-style: italic;
            min-height: 1em;
            font-family: 'Georgia', serif;
        }

        .settings {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
            background: rgba(255, 248, 240, 0.4);
            padding: 0.25rem 0.5rem;
            border-radius: 1.2rem;
            border: 1px solid #d6c8b4;
        }
        .settings label {
            font-size: 0.65rem;
            color: #6a5f55;
            display: flex;
            align-items: center;
            gap: 0.2rem;
            font-weight: 600;
        }
        .settings input[type="range"] {
            width: 55px;
            accent-color: #b8a898;
            background: #d6c8b4;
            border-radius: 10px;
            height: 3px;
        }
        .settings span {
            font-size: 0.65rem;
            color: #3d3228;
            min-width: 18px;
            font-weight: 700;
        }

        .controls {
            display: flex;
            gap: 0.35rem;
            flex-wrap: wrap;
        }
        .controls .btn {
            flex: 1;
            min-width: 42px;
            background: #d6c8b4;
            border: none;
            border-radius: 0.9rem;
            padding: 0.4rem 0.15rem;
            font-size: 0.7rem;
            font-weight: 700;
            color: #3d3228;
            box-shadow: 0 3px 0 #b8a898;
            cursor: pointer;
            transition: all 0.08s ease;
            font-family: 'Georgia', serif;
            text-align: center;
        }
        .controls .btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }
        .controls .btn-primary {
            background: #d4b89a;
            box-shadow: 0 3px 0 #b09072;
        }
        .controls .btn-speak {
            background: #c4b8d8;
            box-shadow: 0 3px 0 #a090b8;
        }
        .controls .btn-all {
            background: #8fb88a;
            color: #1f2a1c;
            box-shadow: 0 3px 0 #5f7a5a;
        }
        .controls .btn-stop {
            background: #e8b4b4;
            color: #5a1a1a;
            box-shadow: 0 3px 0 #c08080;
        }

        .float-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            font-weight: 800;
            color: #d4a840;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.15);
            pointer-events: none;
            opacity: 0;
            z-index: 100;
            white-space: nowrap;
            font-family: 'Georgia', serif;
        }
        .float-text.show {
            animation: floatUp 1s ease-out forwards;
        }
        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            20% {
                opacity: 1;
                transform: translate(-50%, -60%) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -100%) scale(1);
            }
        }

        @media (max-width: 400px) {
            .app {
                padding: 0.4rem;
            }
            .input-row input {
                font-size: 0.85rem;
            }
            .input-row button {
                padding: 0.2rem 0.6rem;
                font-size: 0.75rem;
            }
            .controls .btn {
                font-size: 0.6rem;
                padding: 0.35rem 0.1rem;
                min-width: 35px;
            }
            .settings input[type="range"] {
                width: 40px;
            }
            .thumb {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <div class="thumbnails" id="thumbs"></div>

        <div class="input-row">
            <input type="text" id="input" placeholder="Введите предложение..." value="我是中国人" maxlength="30">
            <button id="renderBtn">✍️</button>
        </div>

        <div class="writer-wrap" id="wrap">
            <div id="hw"></div>
            <div class="draw-overlay" id="overlay"><canvas id="canvas"></canvas></div>
            <div class="float-text" id="float"></div>
        </div>

        <div class="info">
            <span class="label" id="label">⏳ загрузка...</span>
            <span class="status" id="status">✍️</span>
        </div>

        <div class="progress"><div class="progress-fill" id="progress"></div></div>

        <div class="hint" id="hint">✍️ Обводите по порядку черт</div>

        <div class="settings">
            <label>⏱️ <input type="range" id="speed" min="200" max="1500" value="600"><span id="speedVal">600</span></label>
            <label>✏️ <input type="range" id="width" min="3" max="20" value="8"><span id="widthVal">8</span></label>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="animBtn">▶️ анимация</button>
            <button class="btn btn-speak" id="speakBtn">🔊 озвучка</button>
            <button class="btn btn-all" id="allBtn">🎬 все</button>
            <button class="btn" id="resetBtn">⟲ сброс</button>
            <button class="btn btn-primary" id="nextBtn">⏭️ дальше</button>
        </div>
    </div>

    <script>
        // ============================================================
        // ОСНОВНАЯ ЛОГИКА
        // ============================================================
        let chars = [];
        let idx = 0;
        let writer = null;
        let animating = false;
        let done = 0;
        let total = 0;
        let ready = false;
        let playingAll = false;
        let drawCtx = null;
        let drawing = false;
        let lx = 0,
            ly = 0;

        const $ = id => document.getElementById(id);
        const hw = $('hw');
        const overlay = $('overlay');
        const canvas = $('canvas');
        const input = $('input');
        const renderBtn = $('renderBtn');
        const label = $('label');
        const status = $('status');
        const hint = $('hint');
        const progress = $('progress');
        const float = $('float');
        const thumbs = $('thumbs');
        const speed = $('speed');
        const speedVal = $('speedVal');
        const width = $('width');
        const widthVal = $('widthVal');
        const animBtn = $('animBtn');
        const speakBtn = $('speakBtn');
        const allBtn = $('allBtn');
        const resetBtn = $('resetBtn');
        const nextBtn = $('nextBtn');
        const wrap = $('wrap');

        // ============================================================
        // РИСОВАНИЕ
        // ============================================================
        function initDraw() {
            const rect = overlay.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            canvas.style.width = rect.width + 'px';
            canvas.style.height = rect.height + 'px';
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            return ctx;
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const t = e.touches ? e.touches[0] : e;
            return { x: t.clientX - rect.left, y: t.clientY - rect.top };
        }

        function startDraw(e) {
            e.preventDefault();
            drawing = true;
            const p = getPos(e);
            lx = p.x;
            ly = p.y;
            if (!drawCtx) drawCtx = initDraw();
            drawCtx.beginPath();
            drawCtx.moveTo(lx, ly);
        }

        function moveDraw(e) {
            if (!drawing) return;
            e.preventDefault();
            const p = getPos(e);
            if (!drawCtx) drawCtx = initDraw();
            const w = parseInt(width.value) || 8;
            drawCtx.lineWidth = w;
            drawCtx.strokeStyle = '#2563eb';
            drawCtx.shadowColor = 'rgba(37,99,235,0.3)';
            drawCtx.shadowBlur = 4;
            drawCtx.lineTo(p.x, p.y);
            drawCtx.stroke();
            drawCtx.beginPath();
            drawCtx.moveTo(p.x, p.y);
            lx = p.x;
            ly = p.y;
        }

        function endDraw(e) {
            if (drawing) {
                drawing = false;
                if (drawCtx) { drawCtx.closePath();
                    drawCtx.shadowBlur = 0; }
            }
        }

        canvas.addEventListener('touchstart', startDraw, { passive: false });
        canvas.addEventListener('touchmove', moveDraw, { passive: false });
        canvas.addEventListener('touchend', endDraw, { passive: false });
        canvas.addEventListener('touchcancel', endDraw, { passive: false });
        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', moveDraw);
        canvas.addEventListener('mouseup', endDraw);
        canvas.addEventListener('mouseleave', endDraw);

        function clearDraw() {
            if (drawCtx) {
                const r = canvas.getBoundingClientRect();
                drawCtx.clearRect(0, 0, r.width, r.height);
            }
        }

        // ============================================================
        // ОСНОВНЫЕ ФУНКЦИИ
        // ============================================================
        function showFloat(text) {
            float.textContent = text;
            float.classList.remove('show');
            void float.offsetWidth;
            float.classList.add('show');
        }

        function speak(ch) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(ch);
            u.lang = 'zh-CN';
            u.rate = 0.7;
            window.speechSynthesis.speak(u);
        }

        function playSound(type) {
            try {
                const ctx = new(window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
                const now = ctx.currentTime;
                if (type === 'ok') {
                    const o = ctx.createOscillator(),
                        g = ctx.createGain();
                    o.connect(g);
                    g.connect(ctx.destination);
                    o.type = 'sine';
                    o.frequency.setValueAtTime(523, now);
                    o.frequency.exponentialRampToValueAtTime(1046, now + 0.1);
                    g.gain.setValueAtTime(0.25, now);
                    g.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    o.start(now);
                    o.stop(now + 0.25);
                } else if (type === 'err') {
                    const o = ctx.createOscillator(),
                        g = ctx.createGain();
                    o.connect(g);
                    g.connect(ctx.destination);
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(150, now);
                    o.frequency.linearRampToValueAtTime(100, now + 0.15);
                    g.gain.setValueAtTime(0.25, now);
                    g.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    o.start(now);
                    o.stop(now + 0.15);
                } else if (type === 'done') {
                    [523, 659, 784, 1046].forEach((f, i) => {
                        const o = ctx.createOscillator(),
                            g = ctx.createGain();
                        o.connect(g);
                        g.connect(ctx.destination);
                        o.type = 'sine';
                        o.frequency.value = f;
                        g.gain.setValueAtTime(0.2, now + i * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.5);
                        o.start(now + i * 0.1);
                        o.stop(now + i * 0.1 + 0.5);
                    });
                }
            } catch (e) {}
        }

        function updateThumbs(playing) {
            thumbs.innerHTML = '';
            chars.forEach((ch, i) => {
                const el = document.createElement('div');
                el.className = 'thumb' + (i === idx ? ' active' : '') + (i === playing ? ' playing' : '');
                el.innerHTML = `<span class="num">${i+1}</span><span class="char">${ch}</span>`;
                el.onclick = () => { if (!playingAll) { idx = i;
                        loadChar(ch); } };
                thumbs.appendChild(el);
            });
        }

        // ============================================================
        // ЗАГРУЗКА ИЕРОГЛИФА
        // ============================================================
        function loadChar(ch) {
            if (!ch) { ch = '永';
                input.value = '永'; }
            clearDraw();
            label.textContent = `${ch} · загрузка...`;
            status.textContent = '⏳';
            status.className = 'status';
            hint.textContent = '⏳ Загрузка...';
            hw.innerHTML = '';
            ready = false;
            animating = false;
            done = 0;
            progress.style.width = '0%';

            const size = Math.max(150, Math.min(hw.clientWidth, hw.clientHeight));
            const delay = parseInt(speed.value) || 600;
            const w = parseInt(width.value) || 8;

            try {
                writer = HanziWriter.create('hw', ch, {
                    width: size,
                    height: size,
                    padding: 15,
                    showOutline: true,
                    strokeAnimationSpeed: 1.2,
                    delayBetweenStrokes: delay,
                    drawingWidth: Math.max(3, Math.min(14, w)),
                    showCharacter: false,
                    highlightColor: '#c0392b',
                    outlineColor: '#d6c8b4',
                    drawingColor: '#1a1a1a',
                    highlightOnComplete: true
                });

                writer.getCharacterData()
                    .then(function(data) {
                        total = data.strokes.length;
                        ready = true;
                        status.textContent = `✍️ ${total} штрихов`;
                        label.textContent = `${ch} · ${total} штр.`;
                        hint.textContent = '✍️ Обводите по порядку черт';
                        hint.style.color = '#7a6f65';
                        updateThumbs();

                        writer.quiz({
                            onCorrectStroke: function(s) {
                                if (animating) return;
                                done = s.strokeNum;
                                progress.style.width = (done / total * 100) + '%';
                                playSound('ok');
                                if (done === total) {
                                    showFloat('🎉 Отлично!');
                                    playSound('done');
                                    hint.textContent = '✅ Готово! Нажмите "дальше"';
                                    hint.style.color = '#4a6a4a';
                                }
                            },
                            onMistake: function() {
                                if (animating) return;
                                playSound('err');
                                wrap.classList.add('shake');
                                setTimeout(() => wrap.classList.remove('shake'), 400);
                                hint.textContent = '⚠️ Ошибка! Смотрите красную подсказку';
                                hint.style.color = '#8a4a2a';
                            },
                            onComplete: function() {}
                        });
                    })
                    .catch(function(err) {
                        status.textContent = '❌ нет данных';
                        status.className = 'status error';
                        label.textContent = `${ch} · нет данных`;
                        hint.textContent = '❌ Hanzi Writer не поддерживает этот иероглиф';
                        hint.style.color = '#8a4a2a';
                        const fb = document.createElement('div');
                        fb.style.cssText =
                            'width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:4rem;color:#8a7a6a;';
                        fb.textContent = ch;
                        hw.appendChild(fb);
                        updateThumbs();
                    });

            } catch (e) {
                status.textContent = '❌ ошибка';
                status.className = 'status error';
                label.textContent = `${ch} · ошибка`;
                hint.textContent = '❌ Ошибка загрузки';
                hint.style.color = '#8a4a2a';
                const fb = document.createElement('div');
                fb.style.cssText =
                    'width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:4rem;color:#8a7a6a;';
                fb.textContent = ch;
                hw.appendChild(fb);
            }
        }

        // ============================================================
        // ДЕЙСТВИЯ
        // ============================================================
        function animateChar() {
            if (!writer || !ready) { showFloat('⏳ Подождите...'); return; }
            if (animating) return;
            if (playingAll) { showFloat('⏹️ Сначала остановите "все"'); return; }
            animating = true;
            hint.textContent = '🎬 Анимация...';
            hint.style.color = '#8a4a2a';
            speak(chars[idx]);
            writer.animateCharacter({
                onComplete: function() {
                    setTimeout(() => {
                        animating = false;
                        showFloat('🔄 Теперь обводите сами');
                        hint.textContent = '✍️ Обводите по порядку черт';
                        hint.style.color = '#7a6f65';
                    }, 500);
                }
            });
        }

        function speakCurrent() {
            if (chars[idx]) { speak(chars[idx]);
                showFloat(`🔊 ${chars[idx]}`); }
        }

        function resetChar() {
            if (writer) writer.cancelAnimation();
            if (playingAll) stopAll();
            animating = false;
            clearDraw();
            if (chars[idx]) loadChar(chars[idx]);
            showFloat('⟲ Сброс');
        }

        function nextChar() {
            if (playingAll) { showFloat('⏹️ Сначала остановите "все"'); return; }
            if (chars.length === 0) { input.value = '永';
                chars = ['永'];
                idx = 0; }
            idx = (idx + 1) % chars.length;
            clearDraw();
            loadChar(chars[idx]);
            showFloat(`📖 ${chars[idx]}`);
            updateThumbs();
        }

        // ============================================================
        // ВСЕ ИЕРОГЛИФЫ
        // ============================================================
        async function playAll() {
            if (playingAll) { stopAll(); return; }
            if (chars.length === 0) { input.value = '永';
                chars = ['永'];
                idx = 0; }

            playingAll = true;
            allBtn.textContent = '⏹️ стоп';
            allBtn.className = 'btn btn-stop';

            for (let i = 0; i < chars.length; i++) {
                if (!playingAll) break;
                idx = i;
                const ch = chars[i];
                updateThumbs(i);

                await new Promise((resolve) => {
                    loadChar(ch);
                    const check = setInterval(() => {
                        if (ready || status.textContent.includes('нет данных') || status.textContent
                            .includes('ошибка')) {
                            clearInterval(check);
                            speak(ch);
                            showFloat(`📖 ${ch}`);
                            resolve();
                        }
                    }, 100);
                    setTimeout(() => { clearInterval(check);
                        resolve(); }, 3000);
                });

                if (writer && ready) {
                    await new Promise((resolve) => {
                        animating = true;
                        writer.animateCharacter({
                            onComplete: () => {
                                animating = false;
                                setTimeout(resolve, 200);
                            }
                                   });
                    });
                }

                await new Promise(r => setTimeout(r, parseInt(speed.value) * 0.3 + 200));
                if (!playingAll) break;
            }

            playingAll = false;
            allBtn.textContent = '🎬 все';
            allBtn.className = 'btn btn-all';
            showFloat('🎉 Все иероглифы показаны!');
 updateThumbs();
        }

        function stopAll() {
            playingAll = false;
            allBtn.textContent = '🎬 все';
            allBtn.className = 'btn btn-all';
            if (writer) writer.cancelAnimation();
            window.speechSynthesis.cancel();
            updateThumbs();
            showFloat('⏹️ Остановлено');
        }

        // ============================================================
        // ОБРАБОТЧИКИ
        // ============================================================
        renderBtn.onclick = function() {
            if (playingAll) stopAll();
            const text = input.value.trim() || '永';
            chars = text.split('');
            idx = 0;
            clearDraw();
            if (chars.length) { loadChar(chars[0]);
                showFloat(`📖 ${chars[0]}`);
                updateThumbs(); }
        };

        input.onkeydown = function(e) { if (e.key === 'Enter') renderBtn.click(); };

        speed.oninput = function() { speedVal.textContent = this.value; };
        width.oninput = function() { widthVal.textContent = this.value; };

        animBtn.onclick = animateChar;
        speakBtn.onclick = speakCurrent;
        allBtn.onclick = playAll;
        resetBtn.onclick = resetChar;
        nextBtn.onclick = nextChar;

        // ============================================================
        // СТАРТ
        // ============================================================
        const start = input.value.trim() || '永';
        chars = start.split('');
        idx = 0;
        loadChar(chars[0] || '永');
        updateThumbs();

        setTimeout(() => { drawCtx = initDraw(); }, 100);

        let resizeTimer;
        window.onresize = function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (writer && !animating && !playingAll) loadChar(chars[idx]);
                drawCtx = initDraw();
            }, 300);
        };

        console.log('✅ Каллиграфия загружена!');
        console.log('🖌️ Синий маркер + черты с подсказками');
        console.log('🎬 Кнопка "все" — анимация всех иероглифов');
    </script>
</body>
</html>
